name: recall

services:
  db:
    container_name: recall-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quiz}
      POSTGRES_DB: ${POSTGRES_DB:-notion_quiz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [quiznet]

  backend:
    container_name: recall-backend
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-quiz}:${POSTGRES_PASSWORD:-quiz}@db:5432/${POSTGRES_DB:-notion_quiz}
      PORT: 3000
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-agent-key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      NOTION_MCP_URL: ${NOTION_MCP_URL:-}
      NOTION_WORKSPACE_IDS: ${NOTION_WORKSPACE_IDS:-}
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    networks: [quiznet]

  frontend:
    container_name: recall-frontend
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    ports: ["8080:80"]
    networks: [quiznet]

volumes:
  postgres_data:
    name: quiz-app_postgres_data
    external: true

networks:
  quiznet:
    name: recall-network
